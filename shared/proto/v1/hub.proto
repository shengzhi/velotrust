syntax = "proto3";

package velotrust.hub.v1;

option go_package = "velotrust/shared/gen/go/hub/v1;hubv1";

// HubControl is the authenticated control channel used by Client and Gateway
// Agents. Business traffic must not be proxied through this stream.
service HubControl {
  rpc Connect(stream AgentMessage) returns (stream HubMessage);
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_CLIENT = 1;
  NODE_KIND_GATEWAY = 2;
}

message AgentMessage {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ConfigApplied config_applied = 3;
    RuntimeStatus runtime_status = 4;
    // Gateway must answer the first challenge before sending any other
    // control-plane message on this stream.
    X25519AuthProof x25519_auth_proof = 5;
  }
}

message Hello {
  // Deprecated: HUB resolves registered nodes by their X25519 public key and
  // first-time enrollment targets from the unique registration token.
  string node_id = 1;
  NodeKind node_kind = 2;
  string wireguard_public_key = 3;
  string applied_config_hash = 4;
  // Present only for the one-time Gateway enrollment exchange.
  string registration_token = 5;
}

message Heartbeat {
  uint64 sequence = 1;
}

message ConfigApplied {
  string config_hash = 1;
  bool success = 2;
  string error_code = 3;
  string task_id = 4;
  string error_message = 5;
}

message RuntimeStatus {
  uint32 connected_peer_count = 1;
  string applied_config_hash = 2;
  string agent_version = 3;
  string wireguard_status = 4;
  string health_status = 5;
  string last_error_code = 6;
  uint64 sequence = 7;
  // False means connected_peer_count is a storage placeholder and must not be
  // interpreted as a measured zero. Gateways that cannot observe an exact
  // current peer count report false.
  bool connected_peer_count_known = 8;
}

// X25519AuthChallenge is sent only after the HUB has loaded and approved the
// Gateway's registered public key. It is bound to the current TLS connection
// by the challenge-specific TLS exporter used to compute the proof.
message X25519AuthChallenge {
  bytes challenge_id = 1;
  bytes nonce = 2;
  bytes hub_ephemeral_public_key = 3;
  int64 expires_at_unix_millis = 4;
  string hub_instance_id = 5;
  bool registration_challenge = 6;
  // Canonical node_code resolved by HUB; included in the proof transcript.
  string node_id = 7;
}

message X25519AuthProof {
  bytes challenge_id = 1;
  bytes proof = 2;
}

message HubMessage {
  oneof body {
    Welcome welcome = 1;
    ConfigSnapshot config_snapshot = 2;
    HeartbeatAck heartbeat_ack = 3;
    Reauthenticate reauthenticate = 4;
    X25519AuthChallenge x25519_auth_challenge = 5;
    RuntimeStatusAck runtime_status_ack = 6;
    GatewayRegistrationResult gateway_registration_result = 7;
  }
}

message Welcome {
  string session_id = 1;
  uint32 heartbeat_interval_seconds = 2;
  ConfigSnapshot config_snapshot = 3;
}

message ConfigSnapshot {
  // Identifies the content in the database's current desired configuration.
  string config_hash = 1;
  reserved 2;
  reserved "sha256";
  bytes payload = 3;
  string task_id = 4;
}

message HeartbeatAck {
  uint64 sequence = 1;
  int64 server_time_unix = 2;
}

message RuntimeStatusAck {
  uint64 sequence = 1;
  int64 server_time_unix = 2;
  ConfigSnapshot config_snapshot = 3;
}

message GatewayRegistrationResult {
  // When approval is required, HUB first sends a registered/pending result,
  // keeps the stream open, then sends the final active result after approval.
  bool registered = 1;
  bool approval_required = 2;
  string node_status = 3;
}

message Reauthenticate {
  string reason_code = 1;
}
